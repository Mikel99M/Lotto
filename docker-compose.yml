services:
  mongo:
    image: mongo:4.0.10
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: lotto-web
    volumes:
      - mongo_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_AUTH_USERNAME: admin
      ME_CONFIG_MONGODB_AUTH_PASSWORD: admin
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/

  redis:
    image: redis:7.0
    restart: always
    ports:
      - "6379:6379"

  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: always
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8082:8081"

  lotto:
    container_name: lotto
#    build: .
    image: 384235570350.dkr.ecr.eu-central-1.amazonaws.com/lotto:latest
    restart: always
    ports:
      - '8080:8080'
    environment:
      MONGO_USER: root
      MONGO_PASSWORD: example
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DB_NAME: lotto-web
      MONGO_AUTH_SOURCE: admin
      JWT_SECRET: secret
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379

  lotto-frontend:
    container_name: lotto-frontend
#    image: lottofrontend:latest
    image: 384235570350.dkr.ecr.eu-central-1.amazonaws.com/lotto-front
    restart: always
    ports:
      - '80:80'